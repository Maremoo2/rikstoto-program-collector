name: C-DEV-04 24-PDF original holdout source integrity (read only)

on:
  pull_request:
    paths:
      - 'collector/holdout_pdf_source_replay.py'
      - 'tests/test_holdout_pdf_source_replay.py'
      - 'docs/CDEV04_24_ORIGINAL_PDF_COHORT_20261101.md'
      - '.github/workflows/cdev04-24-original-pdf-cohort.yml'

permissions:
  contents: read
  actions: read

jobs:
  original-24-program-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only test dependencies
        run: python -m pip install -r requirements-dev.txt ruff==0.14.4
      - name: Lint source-only auditor and negative tests
        run: ruff check collector/holdout_pdf_source_replay.py tests/test_holdout_pdf_source_replay.py
      - name: Synthetic archive tamper, missing source and no-false-C4 tests
        run: python -m pytest -q tests/test_holdout_pdf_source_replay.py

      - name: Fetch frozen public Betting source-PDF index by pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api             "repos/Maremoo2/Betting/contents/research/data004-holdout-source-pdf-evidence-v1.json?ref=deec4e240293f43261d368c546faa6437f912472"             -H 'Accept: application/vnd.github.raw+json'             > "${RUNNER_TEMP}/betting-original-pdf-evidence.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from collector.holdout_pdf_source_replay import git_blob_sha1
          body = (Path(os.environ["RUNNER_TEMP"]) /
                  "betting-original-pdf-evidence.json").read_bytes()
          actual = git_blob_sha1(body)
          expected = "e39363275abaffae4044b41e5c52f1765c26790e"
          assert actual == expected, (actual, expected)
          print("FROZEN_BETTING_24_PDF_SOURCE_INDEX_BLOB", actual)
          PY

      - name: Download seven immutable original Collector ZIP artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 12135567920 12152059609 12211357452 12219187865 12218163952 12219320854 12210589268; do
            gh api "repos/${GH_REPO}/actions/artifacts/${id}/zip"               > "${RUNNER_TEMP}/original-${id}.zip"
          done

      - name: Replay all 24 original PDFs, page counts and collector receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m collector.holdout_pdf_source_replay             --source-index "${RUNNER_TEMP}/betting-original-pdf-evidence.json"             --expected-index-blob-sha1 e39363275abaffae4044b41e5c52f1765c26790e             --archive "12135567920=${RUNNER_TEMP}/original-12135567920.zip"             --archive "12152059609=${RUNNER_TEMP}/original-12152059609.zip"             --archive "12211357452=${RUNNER_TEMP}/original-12211357452.zip"             --archive "12219187865=${RUNNER_TEMP}/original-12219187865.zip"             --archive "12218163952=${RUNNER_TEMP}/original-12218163952.zip"             --archive "12219320854=${RUNNER_TEMP}/original-12219320854.zip"             --archive "12210589268=${RUNNER_TEMP}/original-12210589268.zip"             --output "${RUNNER_TEMP}/cdev04-24-original-pdf-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "cdev04-24-original-pdf-report.json").read_text())
          print("CDEV04_24_ORIGINAL_PDF_COHORT", json.dumps({
              "status": report["status"],
              "programs": len(report["programs"]),
              "source_hashes": report["pdf_hashes_verified"],
              "pages": report["pdf_page_counts_verified"],
              "official_pdf_receipts": report["pdf_request_receipts_correlated"],
              "typed_physical_pdf_programs": report["typed_physical_meeting_pdf_programs"],
              "typed_composite_pdf_programs": report["typed_composite_product_pdf_programs"],
              "unknown_meeting_type_pdf_programs": report["meeting_type_unverified_pdf_programs"],
              "archives": len(report["archive_diagnostics"]),
              "legacy_json_without_raw": sum(
                  row["legacy_json_receipts_without_raw_bytes"]
                  for row in report["archive_diagnostics"]),
              "errors": report["errors"],
              "c4_gold_pairs_accepted": report["data004e_holdout_gold_pairs_accepted"],
              "c1_full_day": report["independent_complete_day_denominator_verified"],
              "c6_pit": report["c6_t_minus_4_pit_certified"],
              "bet_authorized": report["bet_authorized"],
          }, sort_keys=True))
          assert report["source_index_identity_verified"] is True
          assert report["pdf_hashes_verified"] == 24
          assert report["pdf_page_counts_verified"] == 24
          assert report["pdf_request_receipts_correlated"] == 24
          assert len(report["archive_diagnostics"]) == 7
          assert (
              report["typed_physical_meeting_pdf_programs"]
              + report["typed_composite_product_pdf_programs"]
              + report["meeting_type_unverified_pdf_programs"]
          ) == 24
          assert report["data004e_holdout_gold_pairs_accepted"] == 0
          assert report["data004e_holdout_gold_pairs_total"] == 390
          assert report["c4_gold_accepted"] is False
          assert report["independent_complete_day_denominator_verified"] is False
          assert report["c6_t_minus_4_pit_certified"] is False
          assert report["bet_authorized"] is False
          PY
