name: C-DEV-06 original PDF receipt T-minus-4 source timing (read only)

on:
  pull_request:
    paths:
      - 'collector/pit_source_snapshot.py'
      - 'tests/test_pit_source_snapshot.py'
      - '.github/workflows/cdev06-original-pdf-tminus4.yml'
      - 'docs/CDEV06_ORIGINAL_PDF_TMINUS4_SOURCE_20261101.md'

permissions:
  contents: read
  actions: read

jobs:
  original-pdf-tminus4-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only test dependencies
        run: python -m pip install -r requirements-dev.txt ruff==0.14.4
      - name: Ruff source guard
        run: ruff check collector/pit_source_snapshot.py tests/test_pit_source_snapshot.py
      - name: Synthetic original-PDF, timestamp, DST and no-false-PIT regression
        run: python -m pytest -q tests/test_pit_source_snapshot.py
      - name: Download immutable original 2026-11-01 Collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/artifacts/13072403701/zip" > "${RUNNER_TEMP}/original-nov01.zip"
      - name: Verify SHA-locked original bytes and audited observed race clock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          from collector.archive_integrity_audit import audit_archive_zip
          from collector.pit_source_snapshot import audit_original_pdf_capture_tminus4

          original = Path(os.environ["RUNNER_TEMP"]) / "original-nov01.zip"
          archive = audit_archive_zip(original)
          assert archive["errors"] == [], archive["errors"]
          assert archive["date_oslo"] == "2026-11-01"
          assert archive["pdf_raw_sha_verified"] == 7
          assert archive["json_raw_sha_verified"] == 73
          assert archive["pit_certified"] is False
          with zipfile.ZipFile(original) as z:
              manifests = [name for name in z.namelist() if name.endswith("/manifest.json")]
              assert len(manifests) == 1
              expected = "9e3e5731e05b51b34593033d9a958faa5be10496f7423e32bc3a1ca788438751"
              assert hashlib.sha256(z.read(manifests[0])).hexdigest() == expected

          result = audit_original_pdf_capture_tminus4(original)
          print("CDEV06_ORIGINAL_NOV01_TMINUS4_CAPTURE_DIAGNOSTIC", json.dumps({
              key: value for key, value in result.items() if key != "races"
          }, sort_keys=True, ensure_ascii=False))
          print("CDEV06_RACE_STATUS_COUNTS", json.dumps({
              status: sum(r["status"] == status for r in result["races"])
              for status in sorted({r["status"] for r in result["races"]})
          }, sort_keys=True, ensure_ascii=False))
          assert result["status"] == "SOURCE_CAPTURE_TIMING_DIAGNOSTIC_ONLY"
          assert result["source_candidate_meetings"] == 2
          assert result["candidate_pdf_receipts_sha_verified"] == 2
          assert result["pdf_text_projection_reproduced"] == 2
          assert len(result["races"]) == 21
          assert (result["observed_pdf_capture_before_unverified_clock_tminus4"]
                  + result["observed_pdf_capture_after_unverified_clock_tminus4"]
                  + result["race_clock_or_identity_unverified"]) == 21
          assert result["independent_race_start_time_verified"] is False
          assert result["independent_full_day_no_se_denominator_verified"] is False
          assert result["source_first_publication_time_attested"] is False
          assert result["prospective_tminus4_snapshot_attested"] is False
          assert result["c6_pit_certified"] is False
          assert result["bet_authorized"] is False
          assert result["hq_accepted"] is False
          assert result["production_mutation"] is False
          print("C6_PIT=BLOCKED C1_FULL_DAY=BLOCKED HQ=NOT_ACCEPTED")
          PY
