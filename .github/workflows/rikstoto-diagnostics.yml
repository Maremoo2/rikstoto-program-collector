name: Rikstoto connectivity diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/diagnose.py'
      - '.github/workflows/rikstoto-diagnostics.yml'
  schedule:
    - cron: '15 7 * * 1'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Test Rikstoto connectivity and browser
        id: probe
        continue-on-error: true
        run: |
          python -m collector.diagnose --browser --out diagnostics/report.json 2>&1 | tee diagnostics-console.log
          exit ${PIPESTATUS[0]}
      - name: Publish diagnostics summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("diagnostics/report.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Rikstoto connectivity diagnosis\n\n")
              if not p.exists():
                  f.write("No JSON report was generated. Inspect workflow logs for setup errors.\n")
              else:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  f.write("| Stage | Result | Code | Detail |\n|---|---|---|---|\n")
                  for e in d["events"]:
                      detail=e.get("detail","").replace("|","/").replace("\n"," ")[:150]
                      f.write(f"| {e['stage']} | {'OK' if e['ok'] else 'ERROR'} | `{e['code']}` | {detail} |\n")
                  f.write(f"\n**All prerequisites passed:** {d['success']}\n")
          PY
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikstoto-diagnostics
          path: |
            diagnostics/report.json
            diagnostics-console.log
          if-no-files-found: warn
          retention-days: 14
      - name: Mark failed prerequisites
        if: steps.probe.outcome == 'failure'
        run: |
          echo "Rikstoto diagnostics found a failed prerequisite. See summary and artifact."
          exit 1
