name: Rikstoto connectivity diagnostics

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public Rikstoto page to test (one race URL recommended)"
        required: true
        type: string
        default: "https://www.rikstoto.no/Spill/OR_NR_2026-10-18/V?race=6&p=6:0"
      strategy:
        description: "Stage: HTTP, Chromium, official PDF, or all"
        required: true
        type: choice
        options: [http, browser, pdf, both, all]
        default: all
  push:
    branches: [main]
    paths:
      - 'collector/diagnose.py'
      - 'tests/test_diagnose.py'
      - 'tests/test_pdf_probe.py'
      - 'collector/pdf_probe.py'
      - '.github/workflows/rikstoto-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://www.rikstoto.no/Spill/OR_NR_2026-10-18/V?race=6&p=6:0' }}
      STRATEGY: ${{ inputs.strategy || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies, Playwright and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify diagnostic policy (offline)
        run: python -m pytest tests/test_diagnose.py tests/test_pdf_probe.py -q
      - name: Step-by-step public-site diagnosis
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          python -m collector.diagnose --url "$TARGET_URL" --strategy "$STRATEGY" --out diagnostics/report.json 2>&1 | tee diagnostics-console.log
      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("diagnostics/report.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Rikstoto diagnostics – step-by-step\n\n")
              f.write(f"**Strategy:** {os.environ.get('STRATEGY', '')}\n\n")
              if not p.exists():
                  f.write("No report: installation, tests or script start failed; inspect job logs.\n")
              else:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  f.write(f"**Overall:** {d['status']}\n\n")
                  f.write("| Stage | State | Code | Detail |\n|---|---|---|---|\n")
                  for e in d["stages"]:
                      detail = str(e.get("detail", "")).replace("|", "/").replace("\n", " ")[:140]
                      f.write(f"| {e['stage']} | {e['state']} | {e['code']} | {detail} |\n")
                  f.write("\nThe report describes access/visibility; horse-data correctness is not verified.\n")
          PY
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikstoto-diagnostics
          path: |
            diagnostics/report.json
            diagnostics/browser.png
            diagnostics/official_candidate.pdf
            diagnostics/official_candidate.txt
            diagnostics-console.log
          if-no-files-found: warn
          retention-days: 14
      - name: Fail job when no target page reached
        if: steps.probe.outcome == 'failure'
        run: |
          echo "Access or rendering failed. Inspect the stage table and artifact."
          exit 1
