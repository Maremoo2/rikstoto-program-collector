name: P0 Original Xpress PDF headings replay (read only)

on:
  pull_request:
    paths:
      - 'collector/pdf_program.py'
      - 'tests/test_pdf_program.py'
      - '.github/workflows/pdf-source-heading-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  original-pdf-heading-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned original daily collector archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/actions/artifacts/12726250010/zip" > "${RUNNER_TEMP}/oct27.zip"
          gh api "repos/${GH_REPO}/actions/artifacts/13032657626/zip" > "${RUNNER_TEMP}/oct31.zip"
      - name: Replay actual whole X1 source PDF texts against source PDF hash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path
          from collector.pdf_program import parse_extended_pdf

          cases = (
              (27, "2026-10-27", 7, [5, 7],
               "7663dc0fdcc01e8efd6e5a173dc052059c1ca70293075ce991a5da819d8ec452"),
              (31, "2026-10-31", 4, [11, 12],
               "7b9d6533a910b72a90f12bc6eb30f6c6fe87c741de181aac959ec46f109ad36e"),
          )
          for day_number, day, expected_sections, first_two, expected_pdf_sha in cases:
              archive = Path(os.environ["RUNNER_TEMP"]) / f"oct{day_number}.zip"
              with zipfile.ZipFile(archive) as z:
                  matches = [x for x in z.namelist()
                             if f"/meetings/X1_NR_{day}/full_program.txt" in x]
                  assert len(matches) == 1, matches
                  original = matches[0]
                  pdf_path = original.replace("full_program.txt", "full_program.pdf")
                  assert hashlib.sha256(z.read(pdf_path)).hexdigest() == expected_pdf_sha
                  raw_text = z.read(original).decode("utf-8")
              parsed = parse_extended_pdf(
                  raw_text, meeting_id=f"X1_NR_{day}", date=day,
                  url=f"original-archive:{archive.name}/{original}",
                  captured_at="2026-10-31T06:00:00Z")
              assert parsed["qa"]["race_sections"] == expected_sections, parsed["qa"]
              observed = [r["race"]["race_number"] for r in parsed["races"]]
              sources = [r["race"]["race_number_source"] for r in parsed["races"]]
              print(day, "printed physical numbers", observed, "provenance", sources)
              assert observed[:2] == first_two, observed
              assert sources[1] == "pdf_heading", sources
              assert parsed["qa"]["status"] == "REVIEW_REQUIRED"
              assert all("SCRATCHES_UNVERIFIED" in r["qa"]["warnings"]
                         for r in parsed["races"])
          PY

      - name: Replay November 1st Øvrevoll original PDF and 9-race startlist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/actions/artifacts/13072403701/zip" > "${RUNNER_TEMP}/nov01.zip"
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          from collector.pdf_program import parse_extended_pdf
          from collector.startlist_audit import reconcile_startlist

          day = "2026-11-01"
          key = "OV_NR_2026-11-01"
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "nov01.zip") as archive:
              paths = [name for name in archive.namelist()
                       if name.endswith(f"/meetings/{key}/full_program.txt")]
              assert len(paths) == 1, paths
              text_path = paths[0]
              pdf_path = text_path.replace("full_program.txt", "full_program.pdf")
              assert hashlib.sha256(archive.read(pdf_path)).hexdigest() == (
                  "df4e8659ff2744879edbf6035ede52ea45ff87966b9f051384688f048c8a0e10"
              )
              original_text = archive.read(text_path).decode("utf-8")
              starts_path = text_path.replace("full_program.txt", "starts.json")
              source_wrapper = json.loads(archive.read(starts_path))
          assert source_wrapper["response"]["success"] is True
          parsed = parse_extended_pdf(
              original_text, meeting_id=key, date=day,
              url=f"original-archive:13072403701/{pdf_path}",
              captured_at="2026-11-01T06:20:00+00:00")
          numbers = [r["race"]["race_number"] for r in parsed["races"]]
          assert numbers == list(range(1, 10)), numbers
          assert parsed["races"][1]["race"]["race_number_source"] == "pdf_heading_number"
          assert sum(len(r["entrants"]) for r in parsed["races"]) == 70
          audit = reconcile_startlist(
              parsed["races"], source_wrapper["response"],
              captured_at=source_wrapper["fetched_utc"])
          assert audit["status"] == "MATCHED_AS_OF_SNAPSHOT", audit
          assert audit["race_matches"] == 9 and audit["horses_verified"] == 70, audit
          assert parsed["qa"]["status"] == "REVIEW_REQUIRED"
          # Snapshot source proves field reconciliation at capture, NOT whole-day
          # completeness, immutable original publication time, or T-4 PIT.
          print("ORIGINAL_OVREVOLL_2026_11_01_RECONCILED_AS_OF_SNAPSHOT",
                numbers, audit["horses_verified"])
          PY

      - name: Install exact original pypdf version (Nov 1 capture)
        run: python -m pip install 'pypdf==6.21.4'
      - name: Replay all six Nov 1 physical meetings against original PDF and startlists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/actions/artifacts/13072403701/zip" > "${RUNNER_TEMP}/nov01-all.zip"
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import zipfile
          from pathlib import Path
          from pypdf import PdfReader
          from collector.pdf_program import parse_extended_pdf
          from collector.startlist_audit import reconcile_startlist
          from collector.source_quality import summarize_source_quality

          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "nov01-all.zip") as z:
              names = set(z.namelist())
              manifests = [p for p in names if p.endswith("/manifest.json")]
              assert len(manifests) == 1
              manifest_bytes = z.read(manifests[0])
              assert hashlib.sha256(manifest_bytes).hexdigest() == (
                  "9e3e5731e05b51b34593033d9a958faa5be10496f7423e32bc3a1ca788438751"
              )
              manifest = json.loads(manifest_bytes)
              assert manifest["date_oslo"] == "2026-11-01"
              all_meetings = manifest["meetings"]
              physical = [m for m in all_meetings
                          if m["is_multi_track_product"] is False]
              composite = [m for m in all_meetings
                           if m["is_multi_track_product"] is True]
              assert len(physical) == 6 and len(composite) == 1
              pdf_receipts = {
                  r["path"]: r["sha256"] for r in manifest["requests"]
                  if r.get("status") == "PDF_OK"
              }
              race_keys = set()
              total_horses = 0
              matched_races = 0
              all_parsed_races = []
              for meeting in physical:
                  mid = meeting["meeting_id"]
                  path_prefix = manifests[0].rsplit("/", 1)[0]
                  base = f"{path_prefix}/meetings/{mid}"
                  pdf_path = base + "/full_program.pdf"
                  text_path = base + "/full_program.txt"
                  starts_path = base + "/starts.json"
                  assert all(x in names for x in (pdf_path, text_path, starts_path)), mid
                  pdf = z.read(pdf_path)
                  assert pdf.startswith(b"%PDF-")
                  assert hashlib.sha256(pdf).hexdigest() == pdf_receipts[pdf_path]
                  # Recreate the exact archived extraction from original PDF
                  # bytes, rather than trusting an arbitrary derived .txt file.
                  extracted = "\n\n".join(
                      page.extract_text() or "" for page in PdfReader(io.BytesIO(pdf)).pages
                  )
                  archived_text = z.read(text_path).decode("utf-8")
                  assert extracted == archived_text, mid
                  starts = json.loads(z.read(starts_path))
                  assert starts["response"]["success"] is True, mid
                  parsed = parse_extended_pdf(
                      extracted, meeting_id=mid,
                      date="2026-11-01",
                      url=f"original-archive:13072403701/{pdf_path}",
                      captured_at=starts["fetched_utc"])
                  audit = reconcile_startlist(
                      parsed["races"], starts["response"],
                      captured_at=starts["fetched_utc"])
                  meeting["startlist_pdf_audit"] = audit  # In-memory, original ZIP untouched
                  all_parsed_races.extend(parsed["races"])
                  if mid == "S3_NR_2026-11-01":
                      # Milano's *original* races 7/8 have 18 placeholders
                      # ("Häst 1" etc.) in BOTH PDF and public starts.
                      # String equality is not horse identity corroboration.
                      assert audit["status"] == "PARTIAL_OR_UNVERIFIED", (mid, audit)
                      assert audit["race_matches"] == 6, audit
                      assert audit["horses_verified"] == 56, audit
                      placeholders = [
                          m for m in audit["mismatches"] if isinstance(m, dict)
                          and m.get("code") == "UNRESOLVED_PLACEHOLDER_HORSE_IDENTITY"
                      ]
                      assert [(m["race"], len(m["placeholders"]))
                              for m in placeholders] == [(7, 8), (8, 10)], placeholders
                      assert all(
                          h["scratch_state"] == "UNVERIFIED"
                          for doc in parsed["races"] if doc["race"]["race_number"] in (7, 8)
                          for h in doc["entrants"]
                      )
                  else:
                      assert audit["status"] == "MATCHED_AS_OF_SNAPSHOT", (mid, audit)
                      assert audit["race_matches"] == len(parsed["races"]), mid
                      assert audit["horses_verified"] == sum(
                          len(r["entrants"]) for r in parsed["races"]), mid
                  for race in parsed["races"]:
                      key = (mid, race["race"]["race_number"])
                      assert key not in race_keys, key
                      race_keys.add(key)
                  matched_races += audit["race_matches"]
                  total_horses += audit["horses_verified"]
                  print("PHYSICAL_MEETING_SOURCE_RECONCILED", mid,
                        audit["race_matches"], audit["horses_verified"])
              assert len(race_keys) == 56  # 56 parsed physical race keys
              assert matched_races == 54       # 2 Milano races remain unverified
              assert total_horses == 587       # 18 unresolved names, not 605 real IDs
              quality = summarize_source_quality(manifest, all_parsed_races)
              assert quality["physical_race_candidate_rows"] == 56
              assert quality["physical_horse_rows"] == 605
              assert quality["physical_races_with_reconciled_meeting_snapshot"] == 54
              assert quality["physical_races_with_placeholder_identity"] == 2
              assert quality["physical_placeholder_horse_rows"] == 18
              assert quality["pit_certified"] is False
              assert quality["full_day_denominator_independently_verified"] is False
              # Full observed day sample != all races scheduled in the world
              # and no capture/fetch time proves original provider publication.
              assert manifest["completeness_verified"] is False
              assert manifest["status"] == "REVIEW_REQUIRED"
              assert manifest["calendar_source_diagnostic"]["status"] == "EMPTY_RESULT_ARRAY"
              print("SIX_PHYSICAL_MEETING_SOURCE_REPLAY_PASS", matched_races, total_horses)
          PY
