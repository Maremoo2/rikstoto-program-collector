name: Daily Rikstoto full programs – 07 Oslo

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Europe/Oslo
  push:
    branches: [main]
    paths:
      - 'collector/daily.py'
      - 'collector/pdf_program.py'
      - 'collector/calendar_audit.py'
      - 'collector/homepage_schedule.py'
      - 'collector/release_archive.py'
      - 'collector/prewatch_handoff.py'
      - 'tests/test_prewatch_handoff.py'
      - 'collector/startlist_audit.py'
      - 'collector/parsing.py'
      - 'tests/test_daily.py'
      - 'tests/test_pdf_program.py'
      - 'tests/test_calendar_audit.py'
      - 'tests/test_homepage_schedule.py'
      - 'tests/test_release_archive.py'
      - 'tests/test_startlist_audit.py'
      - '.github/workflows/rikstoto-morning.yml'
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD; blank means today in Norway"
        required: false
        type: string
      seed_meeting:
        description: "Optional known meeting ID (e.g. OR_NR_2026-10-18); does not verify full discovery"
        required: false
        type: string
      persist_archive:
        description: "Save this manual run as private-to-collaborators GitHub draft Release (ZIP + SHA-256)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rikstoto-morning-collector
  cancel-in-progress: false

jobs:
  full-day:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SELECTED_DATE: ${{ inputs.date || '' }}
      SEED_MEETING: ${{ inputs.seed_meeting || '' }}
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record GitHub trigger and scheduled Oslo execution time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Oslo"))
          trigger = os.environ["TRIGGER_EVENT"]
          expected = now.replace(hour=7, minute=0, second=0, microsecond=0)
          delay = round((now - expected).total_seconds() / 60, 1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Triggerkontroll\n\n")
              out.write(f"- Event: `{trigger}`\n")
              out.write(f"- Faktisk registreringstid i Oslo: `{now.isoformat()}`\n")
              if trigger == "schedule":
                  out.write(f"- Avstand fra planlagt kl. 07:00: **{delay} minutter**\n")
                  out.write("- Dette verifiserer en faktisk tidsstyrt kjøring, ikke bare YAML-oppsettet.\n")
              else:
                  out.write("- Dette er en testkjøring, IKKE verifisering av 07:00-triggeren.\n")
          PY
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests before source collection
        run: python -m pytest -q
      - name: Collect all discoverable meetings and official full PDFs
        id: harvest
        continue-on-error: true
        run: |
          set -o pipefail
          args=(--out output/daily)
          if [ -n "$SELECTED_DATE" ]; then args+=(--date "$SELECTED_DATE"); fi
          if [ -n "$SEED_MEETING" ]; then args+=(--seed-meeting "$SEED_MEETING"); fi
          python -m collector.daily "${args[@]}" 2>&1 | tee daily-console.log
      - name: Summarize meetings, PDFs and scratchings
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = sorted(Path("output/daily").glob("*/*/manifest.json"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("# Morgenhenting fra Rikstoto (07:00 Oslo)\n\n")
              if not files:
                  out.write("**INGEN RAPPORT:** Jobben ble avbrutt før kildene kunne kontrolleres. Se logg.\n")
              else:
                  doc = json.loads(files[-1].read_text(encoding="utf-8"))
                  counts = doc.get("counts", {})
                  out.write(f"**Dato:** {doc['date_oslo']}  \n"
                            f"**Status:** {doc['status']}  \n"
                            f"**Fullstendighet verifisert:** {doc['completeness_verified']}  \n"
                            f"**Baner/møter funnet:** {counts.get('meetings_discovered', 0)}  \n"
                            f"**Offisielle program-PDF-er:** {counts.get('full_program_pdfs', 0)}  \n"
                            f"**Positivt identifiserte strykninger:** {counts.get('scratches_positively_identified', 0)}  \n"
                            f"**Strukturerte løp fra PDF:** {counts.get('pdf_races_parsed', 0)}  \n"
                            f"**Hester fra PDF:** {counts.get('pdf_horses_parsed', 0)}  \n"
                            f"**Tidligere starter fra PDF:** {counts.get('pdf_history_rows', 0)}  \n"
                            f"**Selvstendige baner:** {counts.get('independent_tracks', 'ikke verifisert')}  \n"
                            f"**Unike løp (uten Xpress-dobbelttelling):** {counts.get('unique_track_races', 0)}  \n"
                            f"**Hester i unike løp:** {counts.get('unique_track_horses', 0)}  \n"
                            f"**Tidligere starter i unike løp:** {counts.get('unique_track_prior_starts', 0)}  \n"
                            f"**Hester avstemt mot offisiell startliste:** {counts.get('verified_snapshot_horses', 0)}  \n"
                            f"**Strykninger ved innsamling (avstemte løp):** {counts.get('verified_snapshot_scratches', 0)}  \n"
                            f"**Avstemte selvstendige baner:** {counts.get('fully_reconciled_independent_meetings', 0)}  \n\n")
                  out.write("| Møte-ID | Fullt program | Strykningskilde | Løp fra PDF | Strykninger |\n")
                  out.write("|---|---|---|---|---|\n")
                  for m in doc.get("meetings", []):
                      out.write(f"| {m['meeting_id']} | {m['program_pdf']} | {m['scratching_status']} | "
                                f"{len(m.get('pdf_race_numbers', []))} | {m.get('positive_scratches', 0)} |\n")
                  out.write("\n### Varsler\n\n")
                  for warning in doc.get("warnings", []):
                      out.write(f"- \x60{warning}\x60\n")
                  out.write("\n**Dette er et øyeblikksbilde. Ingen påstand om fullstendige baner/løp "
                            "eller endelige strykninger uten separat kildekontroll.**\n")
          PY
      - name: Save daily evidence and full programs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikstoto-morning-programs
          path: |
            output/daily/
            daily-console.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Flag incomplete or unsuccessful collection
        if: steps.harvest.outcome == 'failure'
        run: |
          echo "Collection incomplete: inspect job summary, warnings and downloaded files."
          exit 1

  persist:
    name: Save privately accessible draft archive in GitHub Releases
    needs: [full-day]
    # Normally only schedule/manual captures publish. A single explicitly
    # marked bootstrap commit may also publish today's real-source snapshot.
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.persist_archive == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[archive-now]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout packaging code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download captured daily sources
        uses: actions/download-artifact@v4
        with:
          name: rikstoto-morning-programs
          path: daily-artifact
      - name: Build Pre-Watch read-only source feeds for Norwegian/Swedish races
        run: |
          python -m collector.prewatch_handoff \
            --root daily-artifact/output/daily \
            --dest prewatch_feed
      - name: Build an immutable archive and SHA-256 checksum
        id: package
        run: |
          python -m collector.release_archive \
            --root daily-artifact/output/daily \
            --dest release-assets \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish date release (keep individual run ZIPs unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_FILE: ${{ steps.package.outputs.archive }}
          HASH_FILE: ${{ steps.package.outputs.checksum }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
          RELEASE_DATE: ${{ steps.package.outputs.date }}
        run: |
          set -euo pipefail
          # This release is only a DRAFT visible to the authenticated owner.
          # Release.body also contains a compact index so ChatGPT Pre-Watch
          # can find the exact immutable meeting feed by run and date.
          printf '\n\n' >> "$RELEASE_NOTES"
          cat prewatch_feed/index.md >> "$RELEASE_NOTES"
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$ZIP_FILE" "$HASH_FILE" \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "Rikstoto programarkiv $RELEASE_DATE" \
              --notes-file "$RELEASE_NOTES" --draft --prerelease --latest=false
          else
            # An existing archive must never be silently overwritten.
            for asset in "$ZIP_FILE" "$HASH_FILE"; do
              asset_name="$(basename "$asset")"
              if gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
                    --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                echo "Archive asset already exists, keeping original: $asset_name"
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GH_REPO"
              fi
            done
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable read-only Pre-Watch meeting feeds as draft Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prewatch_release_manifest.tsv
          import json
          from pathlib import Path
          index = json.loads(Path("prewatch_feed/index.json").read_text(encoding="utf-8"))
          for item in index["meeting_feeds"]:
              print(item["release_tag"] + "\t" + item["markdown_name"])
          PY
          while IFS=
\t' read -r release_tag note_file; do
            test -n "$release_tag" || continue
            if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Pre-Watch draft exists; no overwrite: $release_tag"
            else
              gh release create "$release_tag" --repo "$GH_REPO" \
                --target "$GITHUB_SHA" --title "$release_tag" \
                --notes-file "prewatch_feed/$note_file" \
                --draft --prerelease --latest=false
            fi
          done < /tmp/prewatch_release_manifest.tsv
          echo "Pre-Watch read-only draft feeds created or found:"
          wc -l < /tmp/prewatch_release_manifest.tsv

