name: Pre-Watch ready mailbox bootstrap (manual only)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      approval:
        description: 'HQ-approved activation only: CREATE_PREWATCH_READY_DRAFT'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: prewatch-ready-mailbox
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      APPROVAL: ${{ inputs.approval }}
    steps:
      - name: Verify or bootstrap marker-only draft; never publish a source packet
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Maremoo2/rikstoto-program-collector'
          tag = 'prewatch-ready-v1'
          marker = {'schema': 'prewatch_ready_v1', 'status': 'NOT_INITIALIZED', 'bet_authority': False}
          def api(*args, payload=None):
              return json.loads(subprocess.run(['gh', 'api', *args], check=True, text=True,
                                  capture_output=True, input=None if payload is None else json.dumps(payload)).stdout)
          base = f'repos/{repo}/releases'
          rows = [r for page in api(base+'?per_page=100', '--paginate', '--slurp') for r in page if r.get('tag_name') == tag]
          assert len(rows) <= 1, 'DUPLICATE_MAILBOX'
          if not rows:
              if os.environ['DRY_RUN'] == 'true':
                  print('MAILBOX_MISSING_DRY_RUN_NO_WRITE')
                  raise SystemExit(0)
              assert os.environ['APPROVAL'] == 'CREATE_PREWATCH_READY_DRAFT', 'HQ_APPROVAL_REQUIRED'
              assert os.environ['GITHUB_REF'] == 'refs/heads/main', 'DEFAULT_BRANCH_REQUIRED'
              rows = [api(base, '--method', 'POST', '--input', '-', payload={
                  'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'], 'name': tag,
                  'draft': True, 'prerelease': True, 'body': json.dumps(marker)})]
          r = api(base+'/'+str(rows[0]['id']))
          assert r['id'] == rows[0]['id'] and r['tag_name'] == tag and r['draft'] is True
          assert r['published_at'] is None and r['assets'] == [], 'UNSAFE_MAILBOX'
          body = json.loads(r['body'])
          assert body.get('schema') == marker['schema'] and body.get('bet_authority') is False
          print('MAILBOX_DRAFT_READBACK_PASS', r['id'])
          PY
