name: Pre-Watch read-only Ledger authentication diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Default auth-only; full integration requires a verified Collector run ID"
        type: choice
        default: auth_only
        options:
          - auth_only
          - full_integration
          - release_probe
          - shadow_preflight
          - shadow_publish
          - shadow_consume
      approve_draft_readback:
        description: "Explicit approval of draft-capable GitHub token for integration or shadow"
        type: boolean
        default: false
      shadow_consumer_guard_verified:
        description: "Publish only: separately verified that active Pre-Watch rejects SHADOW_ONLY"
        type: boolean
        default: false
      shadow_approval:
        description: "Publish only: exact owner approval PUBLISH_SHADOW_ONLY_458013574"
        type: string
        required: false
      collector_run_id:
        description: "Completed main Collector workflow run ID (integration and shadow)"
        type: string
        required: false
permissions: {}
jobs:
  ledger:
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'auth_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Require configured read-only identity
        env:
          PROVIDER: ${{ vars.PREWATCH_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          LEDGER_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER" || -z "$SERVICE_ACCOUNT" || ! "$LEDGER_ID" =~ ^[A-Za-z0-9_-]{20,120}$ ]]; then
            echo LEDGER_AUTH_CONFIGURATION_MISSING_OR_INVALID
            exit 1
          fi
      - name: Obtain short-lived Sheets read-only token
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.PREWATCH_WIF_PROVIDER }}
          service_account: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify actual Ledger read and schema (no data in logs)
        env:
          LEDGER_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          # Match the canonical column contract proposed in integration PR #63.
          # Read only headers plus at most one data row in each tab.
          expected = {
              "RaceAssessments!A1:AG2": (
                  "assessment_id race_id assessed_at_iso assessment_epoch_utc scheduled_start_epoch_utc "
                  "non_scratched_horses horses_really_assessed fullfield_scratches_QA race_shape_documented "
                  "data_score_25 shape_score_20 mispricing_score_30 liquidity_score_15 fit_score_10 total_score_formula "
                  "score_bounds_QA_formula A_WATCH_GATE_formula FULL_RACE_QA_formula candidate_horse_no candidate_horse_name "
                  "mispricing_hypothesis counterargument race_shape_summary source_url source_observed_at_iso "
                  "assessment_status notes freeze_ref pilot_id STATUS_QA_consistent_formula assessment_ISO_epoch_QA "
                  "field_snapshot_id strict_roster_qa_formula"
              ).split(),
              "RaceFieldSnapshots!A1:U2": (
                  "field_snapshot_id race_id horse_no horse_name post distance_m scratch_state driver trainer "
                  "source_uri observed_at_iso observed_epoch_utc scheduled_start_epoch_utc equipment_asof field_version "
                  "source_kind member_key_formula unique_member_QA_formula official_prestart_QA_formula notes "
                  "observed_ISO_epoch_QA"
              ).split(),
          }

          def fail(code):
              print(code)
              raise SystemExit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          ledger = os.environ.get("LEDGER_ID", "")
          token = os.environ.get("ACCESS_TOKEN", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{20,120}", ledger) or not token:
              fail("LEDGER_AUTH_CONFIGURATION_MISSING_OR_INVALID")
          params = [("ranges", r) for r in expected] + [
              ("majorDimension", "ROWS"),
              ("valueRenderOption", "UNFORMATTED_VALUE"),
          ]
          url = (
              "https://sheets.googleapis.com/v4/spreadsheets/"
              + ledger + "/values:batchGet?" + urllib.parse.urlencode(params)
          )
          request = urllib.request.Request(
              url, headers={"Authorization": "Bearer " + token}, method="GET"
          )
          try:
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(request, timeout=25) as response:
                  if response.status != 200:
                      fail("LEDGER_HTTP_NOT_200")
                  raw = response.read(1_048_577)
              if len(raw) > 1_048_576:
                  fail("LEDGER_RESPONSE_TOO_LARGE")
              body = json.loads(raw)
          except urllib.error.HTTPError as exc:
              fail("LEDGER_HTTP_" + str(exc.code))
          except (ValueError, OSError, UnicodeError):
              fail("LEDGER_READ_OR_RESPONSE_INVALID")

          if not isinstance(body, dict) or body.get("spreadsheetId") != ledger:
              fail("LEDGER_ID_MISMATCH")
          ranges = body.get("valueRanges")
          if not isinstance(ranges, list) or len(ranges) != len(expected):
              fail("LEDGER_RANGES_MISSING")
          for item, (requested, headers) in zip(ranges, expected.items()):
              if not isinstance(item, dict) or item.get("range") != requested or item.get("majorDimension") != "ROWS":
                  fail("LEDGER_RANGE_MISMATCH")
              values = item.get("values")
              if not isinstance(values, list) or not values or values[0] != headers:
                  fail("LEDGER_SCHEMA_MISMATCH")
              if len(values) > 2 or any(not isinstance(row, list) or len(row) > len(headers) for row in values):
                  fail("LEDGER_RESPONSE_SHAPE_INVALID")

          # No cell values, identifiers, token, response body, or artifacts.
          # This proves transport/auth/schema only, never Phase A completion.
          print("LEDGER_READ_CONFIRMED")
          print("AUTH_TEST_PASS: two Ledger ranges; read-only scope; schema verified")
          PY


  release-probe:
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'release_probe' || inputs.mode == 'full_integration')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Compare known draft visibility with read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/prewatch_release_readback.py"
          gh api "repos/$GITHUB_REPOSITORY/contents/collector/prewatch_release_readback.py?ref=$GITHUB_SHA" --jq '.content' | base64 -d > "$script"
          test -s "$script"
          python3 "$script" --probe

  draft-readback:
    # Owner approval required both for merging this workflow and for this dispatch.
    # GitHub does not offer a draft-only read permission. No Google access in this job.
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'full_integration' && inputs.approve_draft_readback == true
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: read
    env:
      COLLECTOR_RUN_ID: ${{ inputs.collector_run_id }}
    outputs:
      receipt: ${{ steps.readback.outputs.receipt }}
    steps:
      - name: Validate existing source run and obtain index (no execution of artifact code)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COLLECTOR_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo INVALID_COLLECTOR_RUN_ID; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COLLECTOR_RUN_ID" > "$RUNNER_TEMP/readback-source-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"readback-source-run.json").read_text())
          if not (d["id"] == int(os.environ["COLLECTOR_RUN_ID"]) and
                  d["repository"]["id"] == 1424144324 and d["workflow_id"] == 388333234 and
                  d["head_branch"] == "main" and d["event"] in {"schedule","workflow_dispatch"} and
                  d["status"] == "completed" and d["conclusion"] == "success"):
              raise SystemExit("SOURCE_RUN_NOT_APPROVED")
          PY
          mkdir -p "$RUNNER_TEMP/readback-input"
          gh run download "$COLLECTOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name prewatch-bridge-fallback --dir "$RUNNER_TEMP/readback-input"
          test -f "$RUNNER_TEMP/readback-input/prewatch_feed/index.json"
      - name: Numeric draft readback with fixed trusted main code (GET only)
        id: readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/prewatch_release_readback.py"
          gh api "repos/$GITHUB_REPOSITORY/contents/collector/prewatch_release_readback.py?ref=$GITHUB_SHA" --jq '.content' | base64 -d > "$script"
          test -s "$script"
          python3 "$script" --index "$RUNNER_TEMP/readback-input/prewatch_feed/index.json"

  integration:
    needs: [release-probe, draft-readback]
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'full_integration' && inputs.approve_draft_readback == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CANDIDATE_SHA: bce63739a2493537aeec4d30693cb6c4f9e61c92
      COLLECTOR_RUN_ID: ${{ inputs.collector_run_id }}
    steps:
      - name: Verify immutable candidate and approved source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COLLECTOR_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo INVALID_COLLECTOR_RUN_ID; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COLLECTOR_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"source-run.json").read_text())
          if not (d["id"] == int(os.environ["COLLECTOR_RUN_ID"]) and
                  d["repository"]["id"] == 1424144324 and d["workflow_id"] == 388333234 and
                  d["head_branch"] == "main" and d["event"] in {"schedule","workflow_dispatch"} and
                  d["status"] == "completed" and d["conclusion"] == "success"):
              raise SystemExit("SOURCE_RUN_NOT_APPROVED")
          print("SOURCE_RUN_IDENTITY_PASS")
          PY
          mkdir -p "$RUNNER_TEMP/pinned-code/collector" "$RUNNER_TEMP/source-input"
          touch "$RUNNER_TEMP/pinned-code/collector/__init__.py"
          for name in prewatch_ready prewatch_ledger_reader prewatch_ready_integration prewatch_release_readback; do
            gh api "repos/$GITHUB_REPOSITORY/contents/collector/$name.py?ref=$CANDIDATE_SHA" --jq '.content' | base64 -d > "$RUNNER_TEMP/pinned-code/collector/$name.py"
            test -s "$RUNNER_TEMP/pinned-code/collector/$name.py"
          done
          gh run download "$COLLECTOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name prewatch-bridge-fallback --dir "$RUNNER_TEMP/source-input"
          echo "PINNED_SOURCE_INPUT_READY"
      - name: Require configured read-only identity
        env:
          PROVIDER: ${{ vars.PREWATCH_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          LEDGER_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          [[ -n "$PROVIDER" && -n "$SERVICE_ACCOUNT" && "$LEDGER_ID" =~ ^[A-Za-z0-9_-]{20,120}$ ]] || { echo LEDGER_AUTH_CONFIGURATION_MISSING_OR_INVALID; exit 1; }
      - name: Obtain short-lived Sheets read-only token
        id: integration_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.PREWATCH_WIF_PROVIDER }}
          service_account: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Full Ledger and source integration (no publication)
        env:
          PREWATCH_LIVE_RELEASE_RECEIPT: ${{ needs.draft-readback.outputs.receipt }}
          PREWATCH_LEDGER_SPREADSHEET_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
          PREWATCH_LEDGER_ACCESS_TOKEN: ${{ steps.integration_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pinned-code"
          python3 - <<'PY'
          import json, os, re, sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from collector.prewatch_ledger_reader import read_live
          from collector.prewatch_ready_integration import main
          try:
              if not os.environ.get("PREWATCH_LIVE_RELEASE_RECEIPT"):
                  raise ValueError("RELEASE_RECEIPT_MISSING")
              if not os.environ.get("PREWATCH_LEDGER_ACCESS_TOKEN"):
                  raise ValueError("LEDGER_ACCESS_TOKEN_MISSING")
              day = datetime.now(ZoneInfo("Europe/Oslo")).date().isoformat()
              result = read_live(day)
              if result["evidence_kind"] != "GOOGLE_API_READ":
                  raise ValueError("LEDGER_EVIDENCE_INVALID")
              print(json.dumps({"status":"FULL_LEDGER_READ_PASS","assessment_rows":result["assessment_rows"],
                                "field_rows":result["field_rows"],"completed_today":len(result["completed_ids"])}))
              root = Path(os.environ["RUNNER_TEMP"]) / "source-input"
              feed = root / "prewatch_feed"
              assets = root / "release-assets"
              archives = list(assets.glob("rikstoto-*.zip"))
              if len(archives) != 1 or not (feed / "index.json").is_file() or not (assets / "release_notes.md").is_file():
                  raise ValueError("SOURCE_ARTIFACT_LAYOUT_INVALID")
              out = Path(os.environ["RUNNER_TEMP"]) / "integration-diagnostic.json"
              sys.argv = ["prewatch_ready_integration", "--feed", str(feed), "--archive", str(archives[0]),
                          "--notes", str(assets / "release_notes.md"), "--output", str(out), "--read-ledger"]
              main()
              packet = json.loads(out.read_text())
              if packet["diagnostic_status"] != "LIVE_LEDGER_SOURCE_DIAGNOSTIC" or packet["replay_only"] or packet["operational_publication_allowed"] or packet["bet_authority"] or packet["phase_a_completed"]:
                  raise ValueError("DIAGNOSTIC_BOUNDARY_INVALID")
              if packet["status"] != "SOURCE_READY" or not packet.get("selected") or not packet.get("queue"):
                  out.unlink()
                  raise ValueError("NO_ELIGIBLE_RACE_IS_NOT_LIVE_READY_PROOF")
              out.unlink()
              print("FULL_INTEGRATION_DIAGNOSTIC_PASS")
          except Exception as exc:
              code = str(exc)
              print(code if re.fullmatch(r"[A-Z][A-Z0-9_]{2,79}", code) else "INTEGRATION_DIAGNOSTIC_FAILED")
              sys.exit(1)
          PY


  shadow:
    # Manual, exact main only. Never executes for existing modes or schedules.
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.approve_draft_readback == true && (inputs.mode == 'shadow_preflight' || inputs.mode == 'shadow_consume' || (inputs.mode == 'shadow_publish' && inputs.shadow_consumer_guard_verified == true && inputs.shadow_approval == 'PUBLISH_SHADOW_ONLY_458013574'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: prewatch-shadow-mailbox-458013574
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      COLLECTOR_RUN_ID: ${{ inputs.collector_run_id }}
      SHADOW_MODE: ${{ inputs.mode }}
      SHADOW_CONSUMER_GUARD_VERIFIED: ${{ inputs.shadow_consumer_guard_verified }}
    steps:
      - name: Load trusted main modules and verified existing source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COLLECTOR_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo INVALID_COLLECTOR_RUN_ID; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COLLECTOR_RUN_ID" > "$RUNNER_TEMP/shadow-source-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"shadow-source-run.json").read_text())
          if not (d["id"] == int(os.environ["COLLECTOR_RUN_ID"]) and
                  d["repository"]["id"] == 1424144324 and d["workflow_id"] == 388333234 and
                  d["head_branch"] == "main" and d["event"] in {"schedule","workflow_dispatch"} and
                  d["status"] == "completed" and d["conclusion"] == "success"):
              raise SystemExit("SOURCE_RUN_NOT_APPROVED")
          print("SHADOW_SOURCE_RUN_IDENTITY_PASS")
          PY
          mkdir -p "$RUNNER_TEMP/shadow-code/collector" "$RUNNER_TEMP/shadow-source"
          touch "$RUNNER_TEMP/shadow-code/collector/__init__.py"
          for name in prewatch_ready prewatch_ledger_reader prewatch_ready_integration prewatch_release_readback prewatch_shadow_mailbox; do
            gh api "repos/$GITHUB_REPOSITORY/contents/collector/$name.py?ref=$GITHUB_SHA" --jq '.content' | base64 -d > "$RUNNER_TEMP/shadow-code/collector/$name.py"
            test -s "$RUNNER_TEMP/shadow-code/collector/$name.py"
          done
          gh run download "$COLLECTOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name prewatch-bridge-fallback --dir "$RUNNER_TEMP/shadow-source"
      - name: Require configured Google Viewer identity
        env:
          PROVIDER: ${{ vars.PREWATCH_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          LEDGER_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          [[ -n "$PROVIDER" && -n "$SERVICE_ACCOUNT" && "$LEDGER_ID" =~ ^[A-Za-z0-9_-]{20,120}$ ]] || { echo LEDGER_AUTH_CONFIGURATION_MISSING_OR_INVALID; exit 1; }
      - name: Obtain short-lived Sheets read-only token
        id: shadow_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.PREWATCH_WIF_PROVIDER }}
          service_account: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Run shadow protocol (no public packet or Ledger artifact)
        env:
          GH_TOKEN: ${{ github.token }}
          PREWATCH_LEDGER_SPREADSHEET_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
          PREWATCH_LEDGER_ACCESS_TOKEN: ${{ steps.shadow_auth.outputs.access_token }}
          SHADOW_APPROVAL: ${{ inputs.shadow_approval }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/shadow-code"
          python3 -m collector.prewatch_shadow_mailbox

  shadow-approval-required:
    if: github.repository_id == '1424144324' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'shadow_preflight' || inputs.mode == 'shadow_publish' || inputs.mode == 'shadow_consume') && (inputs.approve_draft_readback != true || (inputs.mode == 'shadow_publish' && (inputs.shadow_consumer_guard_verified != true || inputs.shadow_approval != 'PUBLISH_SHADOW_ONLY_458013574')))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo SHADOW_APPROVAL_REQUIRED; exit 1
