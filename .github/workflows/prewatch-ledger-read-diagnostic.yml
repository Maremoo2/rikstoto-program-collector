name: Pre-Watch read-only Ledger authentication diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require configured read-only identity
        env:
          PROVIDER: ${{ vars.PREWATCH_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PREWATCH_LEDGER_READER_SA }}
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT" || { echo LEDGER_AUTH_CONFIGURATION_MISSING; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PREWATCH_WIF_PROVIDER }}
          service_account: ${{ vars.PREWATCH_LEDGER_READER_SA }}
          create_credentials_file: true
      - run: python -m pip install 'google-auth[requests]>=2,<3'
      - name: Read Ledger (aggregate diagnostics only)
        env:
          PREWATCH_LEDGER_SPREADSHEET_ID: ${{ secrets.PREWATCH_LEDGER_SPREADSHEET_ID }}
        run: python -m collector.prewatch_ledger_reader
