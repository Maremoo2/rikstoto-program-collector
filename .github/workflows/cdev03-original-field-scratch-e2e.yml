name: C-DEV-03 original PDF/starts scratch identity replay (read only)

on:
  pull_request:
    paths:
      - 'collector/startlist_audit.py'
      - 'collector/pdf_program.py'
      - 'collector/daily.py'
      - 'tests/test_startlist_audit.py'
      - 'tests/test_pdf_program.py'
      - '.github/workflows/cdev03-original-field-scratch-e2e.yml'

permissions:
  contents: read
  actions: read

jobs:
  original-no-se-field:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt ruff==0.14.4
      - name: Ruff on C-DEV-03 edited source and regression tests
        run: ruff check collector/startlist_audit.py collector/pdf_program.py collector/daily.py tests/test_startlist_audit.py tests/test_pdf_program.py
      - name: Download immutable November 1 original PDF and JSON capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/${GH_REPO}/actions/artifacts/13072403701/zip" > "${RUNNER_TEMP}/nov01.zip"
      - name: Reparse original archived PDFs and snapshot official starts without live GET
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          from collector.archive_integrity_audit import audit_archive_zip
          from collector.daily import scratch_signals
          from collector.pdf_program import parse_extended_pdf
          from collector.no_se_calendar import audit_no_se_trot_discovery
          from collector.startlist_audit import (
              reconcile_startlist, stage_unverified_positive_scratch_signals,
          )

          path = Path(os.environ["RUNNER_TEMP"]) / "nov01.zip"
          verified = audit_archive_zip(path)
          assert verified["errors"] == [], verified
          assert verified["pdf_raw_sha_verified"] == 7
          assert verified["json_raw_sha_verified"] == 73
          assert verified["raw_provenance_complete"] is True
          assert verified["completeness_verified"] is False
          assert verified["pit_certified"] is False
          totals = dict(meetings_checked=0, races_reparsed=0, horses_reparsed=0,
                        snapshot_races_verified=0, snapshot_races_unverified=0,
                        source_unavailable_meetings=0,
                        no_se_trot_meetings_checked=0,
                        no_se_trot_races_reparsed=0,
                        no_se_trot_snapshot_races_verified=0,
                        no_se_trot_horses_reparsed=0)
          with zipfile.ZipFile(path) as arc:
              manifest_paths = [n for n in arc.namelist() if n.endswith("/manifest.json")]
              assert len(manifest_paths) == 1
              manifest_bytes = arc.read(manifest_paths[0])
              manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
              assert manifest_sha == "9e3e5731e05b51b34593033d9a958faa5be10496f7423e32bc3a1ca788438751"
              day = json.loads(manifest_bytes)
              no_se_source = audit_no_se_trot_discovery(day)
              target_ids = set(no_se_source["no_se_trot_physical_candidate_ids"])
              assert target_ids == {"MO_NR_2026-11-01", "S1_NR_2026-11-01"}
              assert no_se_source["independent_whole_day_denominator_verified"] is False
              root = manifest_paths[0][:-len("manifest.json")]
              paths = set(arc.namelist())
              for entry in day["meetings"]:
                  if entry.get("is_multi_track_product") is not False:
                      continue
                  mid = entry["meeting_id"]
                  prefix = root + "meetings/" + mid + "/"
                  pdf_text_file = prefix + "full_program.txt"
                  starts_file = prefix + "starts.json"
                  if pdf_text_file not in paths or starts_file not in paths:
                      totals["source_unavailable_meetings"] += 1
                      continue
                  text = arc.read(pdf_text_file).decode("utf-8")
                  payload = json.loads(arc.read(starts_file))
                  starts = payload.get("response")
                  if not isinstance(starts, dict):
                      totals["source_unavailable_meetings"] += 1
                      continue
                  # Reparse from source-derived archived PDF text. The exact
                  # original PDF bytes and JSON raw response were checked
                  # above against source hashes; no new acquisition occurs.
                  docs = parse_extended_pdf(
                      text, meeting_id=mid, date="2026-11-01",
                      url="offline-archive:" + mid,
                      captured_at="2026-11-01T06:19:15Z",
                  )["races"]
                  events = scratch_signals(starts)["positive_scratches"]
                  for doc in docs:
                      stage_unverified_positive_scratch_signals(doc, events)
                      assert all(h["scratched"] is None and
                                 h["scratch_state"] == "UNVERIFIED"
                                 for h in doc["entrants"])
                      assert doc["scratches"] == []
                  audit = reconcile_startlist(docs, starts)
                  good = set(audit["verified_race_numbers"])
                  totals["meetings_checked"] += 1
                  if mid in target_ids:
                      totals["no_se_trot_meetings_checked"] += 1
                      totals["no_se_trot_races_reparsed"] += len(docs)
                      totals["no_se_trot_snapshot_races_verified"] += len(good)
                      totals["no_se_trot_horses_reparsed"] += sum(
                          len(d["entrants"]) for d in docs
                      )
                  totals["races_reparsed"] += len(docs)
                  totals["horses_reparsed"] += sum(len(d["entrants"]) for d in docs)
                  totals["snapshot_races_verified"] += len(good)
                  totals["snapshot_races_unverified"] += len(docs) - len(good)
                  for doc in docs:
                      n = doc["race"]["race_number"]
                      if n in good:
                          assert all(h["scratch_state"] in (
                              "ACTIVE_AS_OF_SNAPSHOT", "SCRATCHED_AS_OF_SNAPSHOT")
                              for h in doc["entrants"])
                      else:
                          assert all(h["scratched"] is None for h in doc["entrants"])
                          assert not doc["scratches"]
                  print("CDEV03_OFFLINE_MEETING", mid,
                        json.dumps({"parsed_races": len(docs),
                                    "parsed_horses": sum(len(d["entrants"]) for d in docs),
                                    "reconciled_races": len(good),
                                    "status": audit["status"],
                                    "mismatches": audit["mismatches"]},
                                   ensure_ascii=False, sort_keys=True))
          # SHA-pinned original Nov 1 cohort: exact first-party PDF/starts
          # baseline, NEVER the independent complete-day C3 denominator.
          assert totals["meetings_checked"] == 6, totals
          assert totals["races_reparsed"] == 56, totals
          assert totals["horses_reparsed"] == 605, totals
          assert totals["snapshot_races_verified"] == 54, totals
          assert totals["snapshot_races_unverified"] == 2, totals
          assert totals["no_se_trot_meetings_checked"] == 2, totals
          assert totals["no_se_trot_races_reparsed"] == 21, totals
          assert totals["no_se_trot_snapshot_races_verified"] == 21, totals
          assert totals["no_se_trot_horses_reparsed"] == 238, totals
          print("CDEV03_ORIGINAL_OFFLINE_SOURCE_REPLAY", json.dumps(totals, sort_keys=True))
          print("INDEPENDENT_C3_FIELD_COVERAGE=UNVERIFIED C1=BLOCKED C6_PIT=BLOCKED")
          PY
